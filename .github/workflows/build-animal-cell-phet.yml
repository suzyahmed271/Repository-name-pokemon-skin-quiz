name: Build Animal Cell PhET Adaptation

on:
  workflow_dispatch:
  push:
    branches: [animal-cell-phet]
    paths: ['animal-cell-phet-overlay/**', '.github/workflows/build-animal-cell-phet.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout adaptation overlay
        uses: actions/checkout@v5
        with: { ref: animal-cell-phet }
      - name: Set up Node
        uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Clone PhET repositories
        shell: bash
        run: |
          set -e
          mkdir -p workspace
          cd workspace
          for repo in assert axon babel brand chipper dot gene-expression-essentials griddle joist kite phet-core phetcommon phetmarks query-string-machine scenery scenery-phet sherpa sun tambo tandem twixt utterance-queue; do git clone --depth 1 "https://github.com/phetsims/$repo.git"; done
          git clone --depth 1 https://github.com/phetsims/perennial.git perennial-alias
          for repo in assert axon babel brand dot gene-expression-essentials griddle joist kite phet-core phetcommon phetmarks query-string-machine scenery scenery-phet sherpa sun tambo tandem twixt utterance-queue; do
            sha=$(node -e "const d=require('./gene-expression-essentials/dependencies.json'); process.stdout.write(d['$repo']?.sha || '')")
            if [ -n "$sha" ]; then git -C "$repo" fetch --quiet --unshallow; git -C "$repo" checkout --quiet "$sha"; fi
          done
      - name: Overlay Animal Cell source
        shell: bash
        run: |
          set -e
          cp animal-cell-phet-overlay/js/gene-expression-essentials-main.js workspace/gene-expression-essentials/js/gene-expression-essentials-main.js
          mkdir -p workspace/gene-expression-essentials/js/animal-cell
          cp animal-cell-phet-overlay/js/animal-cell/*.js workspace/gene-expression-essentials/js/animal-cell/
      - name: Install PhET build dependencies
        shell: bash
        run: |
          set -e
          cd workspace/chipper; npm install
          cd ../perennial-alias; npm install
          cd ../gene-expression-essentials; npm install
      - name: Build adapted-from-phet HTML
        shell: bash
        run: |
          set -e
          cd workspace/gene-expression-essentials
          npx grunt --brands=adapted-from-phet
      - name: Collect build
        shell: bash
        run: |
          mkdir -p dist
          cp workspace/gene-expression-essentials/build/adapted-from-phet/*_en_adapted-from-phet.html dist/index.html
          cp animal-cell-phet-overlay/README.md dist/README.md
      - name: Upload built simulation
        uses: actions/upload-artifact@v4
        with: { name: animal-cell-phet-adapted, path: dist/ }
